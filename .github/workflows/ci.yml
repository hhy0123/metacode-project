name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check jobs/ tests/
          ruff format --check jobs/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Airflow
        run: pip install "apache-airflow==2.8.0" pendulum
      - name: Parse DAGs
        run: |
          for dag in dags/*.py; do
            python -c "import ast; ast.parse(open('$dag').read())"
          done

  validate-ddl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DDL has Iceberg properties
        run: |
          for f in ddl/*.sql; do
            if ! grep -q "ICEBERG" "$f"; then
              echo "❌ $f missing ICEBERG table_type"
              exit 1
            fi
          done
          echo "✅ all DDL files declare ICEBERG"
