name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff==0.3.0
      - name: Lint
        run: |
          ruff check jobs/ tests/ || true
          ruff format --check jobs/ tests/ || true

  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse DAGs
        run: |
          for dag in dags/*.py; do
            python -c "import ast; ast.parse(open('$dag').read())"
          done

  validate-ddl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DDL has Iceberg properties
        run: |
          for f in ddl/*.sql; do
            if ! grep -q "ICEBERG" "$f"; then
              echo "::error::$f missing ICEBERG table_type"
              exit 1
            fi
          done
          echo "all DDL files declare ICEBERG"

  validate-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse all Python files
        run: |
          for f in $(find jobs tests -name "*.py"); do
            python -c "import ast; ast.parse(open('$f').read())"
          done
