[project]
name = "propberg"
version = "0.2.0"
description = "한국 부동산 실거래가 실시간 레이크하우스 (Iceberg + Kafka + Spark Streaming)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kafka-python==2.0.2",
    "requests==2.31.0",
    "boto3==1.34.0",
    "python-dotenv==1.0.0",
    "pyspark==3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "ruff==0.3.0",
    "pre-commit==3.6.0",
    "moto[s3]==5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dags/", "monitoring/", "ddl/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-length은 자체 옵션으로 처리

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
